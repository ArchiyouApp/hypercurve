[package]
name = "hypercurve"
version = "0.3.1"
edition = "2024"
description = "Hyperreal-backed planar curves, contours, and regions for CAD topology"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/hypercurve"
readme = "README.md"
keywords = ["cad", "curves", "geometry", "hyperreal", "topology"]
categories = ["mathematics", "graphics", "algorithms"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Archiyou fork tweak: upstream carries `path = "../hyperreal"` alongside the version. meshup
# checks the siblings out at `rust/<name>` and redirects them through its own
# `[patch.crates-io]`, so the paths are dropped here — `../hypertri` has no checkout at all and
# a path dependency must resolve even when its feature is off.
hyperreal = { version = "0.13.1", default-features = false }
hypersolve = { version = "0.3.1", default-features = false }
hyperlimit = { version = "0.4.1", default-features = false, features = ["std"], optional = true }
hypertri = { version = "0.4.1", default-features = false, features = ["earcut"], optional = true }
num = { version = "0.4.3", features = ["num-bigint"] }
cavalier_contours = { version = "0.7.0", optional = true }
# Archiyou fork tweak: upstream pins curvo 0.1.91 (-> geo 0.33 -> i_overlay 4.5),
# which conflicts with meshup's geo 0.31 (-> i_overlay 4.0). Only used by the
# comparative-benchmarks feature, which meshup never enables.
curvo = { version = "0.1.81", optional = true }
i_overlay = { version = "7.0.2", default-features = false, optional = true }
nalgebra = { version = "0.35", optional = true }
svg = { version = "0.18", optional = true }
svgtypes = { version = "0.16.1", optional = true }
[dev-dependencies]
# Archiyou fork tweak: upstream uses geo 0.33.1, but cargo resolves this dev-dep
# alongside meshup (geo 0.31 -> i_overlay 4.0), which conflicts. Kept at 0.31 so the
# meshup workspace resolves; only tests/hypercurve_geo_regressions.rs uses geo.
geo = "0.31"
proptest = "1"

[features]
default = []
dispatch-trace = ["hyperreal/dispatch-trace", "hyperlimit/dispatch-trace"]
triangulation = ["dep:hypertri"]
svg = ["dep:svg", "dep:svgtypes", "hyperreal/serde"]
hershey = []
comparative-benchmarks = [
    "dep:cavalier_contours",
    "dep:curvo",
    "dep:i_overlay",
    "dep:nalgebra",
]

[[bench]]
name = "containment"
harness = false

[[bench]]
name = "intersection"
harness = false

[[bench]]
name = "intersection_sweep"
harness = false

[[bench]]
name = "bezier_algebraic_parameter"
harness = false

[[bench]]
name = "bezier_arrangement"
harness = false

[[bench]]
name = "bezier_rational_overlap"
harness = false

[[bench]]
name = "bezier_region"
harness = false

[[bench]]
name = "curve_region_boolean_batch"
harness = false

[[bench]]
name = "bezier_split_materialization"
harness = false

[[bench]]
name = "bezier_evaluation"
harness = false

[[bench]]
name = "bezier_tangent_order"
harness = false

[[bench]]
name = "bspline"
harness = false

[[bench]]
name = "rational_bezier"
harness = false

[[bench]]
name = "arc"
harness = false

[[bench]]
name = "curve_path"
harness = false

[[bench]]
name = "straight_skeleton"
harness = false

[[bench]]
name = "offset"
harness = false

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "reconstruction"
harness = false

[[bench]]
name = "dispatch_trace"
harness = false
required-features = ["dispatch-trace"]

[[bench]]
name = "api_surface"
harness = false
required-features = ["triangulation"]

[[bench]]
name = "finite_projection"
harness = false

[[bench]]
name = "comparative"
harness = false
required-features = ["comparative-benchmarks"]

[[bench]]
name = "pathological_regions"
harness = false

[patch.crates-io]
hyperreal = { path = "../hyperreal" }
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hypersolve = { path = "../hypersolve" }
hypertri = { path = "../hypertri" }
